name: Publish Topocode to npm

on:
  push:
    tags:
      - "npm-bootstrap/v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in distribution/package.json
        required: true
        type: string
      mode:
        description: Verify only, normal OIDC publication, or first-package token bootstrap
        required: true
        default: verify
        type: choice
        options: [verify, oidc, bootstrap]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org

jobs:
  verify:
    if: github.repository == 'jdylanmc/topo-code'
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.package.outputs.filename }}
      version: ${{ steps.package.outputs.version }}
      mode: ${{ steps.package.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the requested package and renderer identity
        id: package
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_MODE: ${{ inputs.mode }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('distribution/package.json'));
          const renderer = pkg.dependencies['@jdylanmc/topo-archify'];
          const exact = /^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/;
          if (pkg.name !== '@jdylanmc/topo-code' || !exact.test(pkg.version) || !exact.test(renderer)) {
            throw new Error('Invalid committed package identity or exact renderer dependency.');
          }
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const commit = git('rev-parse', 'HEAD');
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH));
          let mode;
          if (process.env.GITHUB_EVENT_NAME === 'push') {
            const expected = `refs/tags/npm-bootstrap/v${pkg.version}-${commit}`;
            if (process.env.GITHUB_REF !== expected || event.created !== true || event.deleted || event.forced ||
                event.before !== '0'.repeat(40) || !/^[a-f0-9]{40}$/.test(event.after ?? '') ||
                git('rev-parse', `${event.after}^{commit}`) !== commit) {
              throw new Error('Bootstrap requires a newly created version-and-commit tag; updates and mismatches are forbidden.');
            }
            mode = 'bootstrap';
          } else if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' &&
              process.env.GITHUB_REF === 'refs/heads/main' && pkg.version === process.env.REQUESTED_VERSION &&
              ['verify', 'oidc', 'bootstrap'].includes(process.env.PUBLISH_MODE)) {
            mode = process.env.PUBLISH_MODE;
          } else {
            throw new Error('Manual publication requires main, the exact committed version, and an explicit supported mode.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `mode=${mode}\nversion=${pkg.version}\nfilename=jdylanmc-topo-code-${pkg.version}.tgz\nrenderer=${renderer}\nrendererFile=jdylanmc-topo-archify-${renderer}.tgz\n`);
          NODE
      - name: Require an unpublished package for bootstrap
        if: steps.package.outputs.mode == 'bootstrap'
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://registry.npmjs.org/@jdylanmc%2ftopo-code', { signal: AbortSignal.timeout(30000) });
          if (response.status !== 404) throw new Error(`Bootstrap requires an absent public package; registry returned ${response.status}. Use OIDC for existing packages.`);
          NODE
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Fetch the already-published exact renderer
        env:
          RENDERER_VERSION: ${{ steps.package.outputs.renderer }}
          RENDERER_FILE: ${{ steps.package.outputs.rendererFile }}
        run: |
          mkdir "$RUNNER_TEMP/renderer-package"
          npm pack "@jdylanmc/topo-archify@$RENDERER_VERSION" --ignore-scripts --pack-destination "$RUNNER_TEMP/renderer-package" --registry https://registry.npmjs.org
          node scripts/bootstrap-renderer.mjs "$RUNNER_TEMP/renderer-package/$RENDERER_FILE"
      - run: corepack yarn workspace @topo/site exec playwright install --with-deps chromium
      - run: corepack yarn test:regression
      - name: Pack and exercise the installed consumer
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
          RENDERER_FILE: ${{ steps.package.outputs.rendererFile }}
        run: |
          node scripts/pack.mjs dist
          node scripts/package-smoke.mjs "dist/$PACKAGE_FILE" "$RUNNER_TEMP/renderer-package/$RENDERER_FILE"
          sha256sum dist/*.tgz > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-candidate-${{ github.sha }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error

  publish-oidc:
    needs: verify
    if: needs.verify.outputs.mode == 'oidc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require an OIDC-capable npm CLI
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            throw new Error(`npm >=11.5.1 is required for trusted publishing; received ${version}`);
          }
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate-${{ github.sha }}
          path: dist
      - run: sha256sum --check dist/SHA256SUMS
      - name: Publish the tested tarball using npm trusted publishing
        env:
          PACKAGE_FILE: ${{ needs.verify.outputs.filename }}
        run: npm publish "./dist/$PACKAGE_FILE" --access public --ignore-scripts --provenance --registry https://registry.npmjs.org

  publish-bootstrap:
    needs: verify
    if: needs.verify.outputs.mode == 'bootstrap'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate-${{ github.sha }}
          path: dist
      - run: sha256sum --check dist/SHA256SUMS
      - name: Bootstrap the first version using the UI-managed one-time secret
        env:
          PACKAGE_FILE: ${{ needs.verify.outputs.filename }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set NPM_BOOTSTRAP_TOKEN through GitHub Actions secrets before bootstrap."
            exit 1
          fi
          npm whoami --registry https://registry.npmjs.org
          echo "::notice::Authenticated npm identity only; package creation rights are checked by the real publish."
          npm publish "./dist/$PACKAGE_FILE" --access public --ignore-scripts --provenance=false --registry https://registry.npmjs.org

  verify-publication:
    needs: [verify, publish-oidc, publish-bootstrap]
    if: always() && (needs.publish-oidc.result == 'success' || needs.publish-bootstrap.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate-${{ github.sha }}
          path: dist
      - name: Verify the public registry version
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
          PACKAGE_FILE: ${{ needs.verify.outputs.filename }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const identity = `@jdylanmc/topo-code@${process.env.PACKAGE_VERSION}`;
          const integrity = JSON.parse(execFileSync('npm', ['view', identity, 'dist.integrity', '--json', '--registry', 'https://registry.npmjs.org'], { encoding: 'utf8' }));
          const expected = `sha512-${createHash('sha512').update(readFileSync(`dist/${process.env.PACKAGE_FILE}`)).digest('base64')}`;
          if (integrity !== expected) throw new Error('Published tarball integrity does not match the verified artifact.');
          console.log(`Verified public registry bytes for ${identity}`);
          NODE
      - name: Verify registry-only CLI installation
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
        run: npm exec --yes --package="@jdylanmc/topo-code@$PACKAGE_VERSION" -- topo --help

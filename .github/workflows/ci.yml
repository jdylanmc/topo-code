name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: yarn install --immutable
      - name: ESLint correctness baseline
        run: yarn lint
      - run: yarn workspace @topo/site exec playwright install --with-deps chromium
      - run: yarn test:regression

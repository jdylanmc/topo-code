name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topocode
    steps:
      - uses: actions/checkout@v4
        with:
          path: topocode
      - name: Check out the reviewed renderer packaging source
        uses: actions/checkout@v4
        with:
          repository: jdylanmc/topo-archify
          ref: 3b815dc04d637dbde424a0fa3d240e8b75439627
          path: renderer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: topocode/.node-version
      - run: corepack enable
      - run: yarn install --immutable
      - name: Build and verify the pinned renderer package
        run: |
          node --test ../renderer/integrations/topo-npm/package.test.mjs
          node ../renderer/integrations/topo-npm/pack.mjs ../renderer/dist
          node scripts/bootstrap-renderer.mjs ../renderer/dist/jdylanmc-topo-archify-0.1.0.tgz
      - name: ESLint correctness baseline
        run: yarn lint
      - run: yarn workspace @topo/site exec playwright install --with-deps chromium
      - run: yarn test:regression
      - name: Verify the installed public toolbelt
        run: |
          node scripts/pack.mjs dist
          node scripts/package-smoke.mjs dist/jdylanmc-topo-code-0.1.0.tgz ../renderer/dist/jdylanmc-topo-archify-0.1.0.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidates
          path: |
            topocode/dist/*.tgz
            renderer/dist/*.tgz
